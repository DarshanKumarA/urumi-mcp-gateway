# Host mapping belongs to a later authorized Windows setup step.
# k3d already maps host 8080 to Traefik HTTP 80; Ingress host has no port.
# Sizes, resource budgets and DB name/user inherit the shared defaults.
wordpress:
  canonicalUrl: http://store.urumi.test:8080
  persistence:
    storageClass: local-path
  ingress:
    className: traefik
    host: store.urumi.test
    tls:
      enabled: false

mariadb:
  persistence:
    storageClass: local-path

bootstrap:
  # Non-secret demo identity; the password comes only from the external Secret.
  adminEmail: admin@urumi.test

wooMcp:
  enabled: true
  image:
    repository: urumi-woo-mcp
    tag: stage8.0
    # Later import this exact local build into k3d before the authorized upgrade.
    pullPolicy: Never
  config:
    connection_origin: http://urumi-wordpress.urumi.svc.cluster.local
    canonical_origin: http://store.urumi.test:8080
    currency: INR
    store_timezone: Asia/Kolkata
  # Resources/security inherit shared starting budgets; validate in Stage 4.9.

# Same stateless templates; Kubernetes runtime acceptance remains pending.
auxiliaryMcp:
  arithmetic-mcp:
    enabled: true
    image:
      repository: urumi-arithmetic-mcp
      tag: stage6.1
      pullPolicy: Never
  store-policy-mcp:
    enabled: true
    image:
      repository: urumi-store-policy-mcp
      tag: stage6.1
      pullPolicy: Never

platform:
  enabled: true
  origin: http://gateway.urumi.test:8080
  postgres:
    storageClass: local-path
  gateway:
    image: {repository: urumi-gateway, tag: stage8.0, pullPolicy: Never}
    environment: local
    secureCookie: false
  dashboard:
    image: {repository: urumi-dashboard, tag: stage7.1, pullPolicy: Never}
  ingress:
    host: gateway.urumi.test
    tls: {enabled: false, secretName: ""}
