# Stage 3.3: bootstrap/readiness implemented for static review; runtime unverified.
# Namespace comes from Helm --namespace; this chart does not create it.
# Secrets are supplied externally. These values contain references, never values.

wordpress:
  # The tag communicates the version; the digest fixes Linux/amd64 contents.
  image: docker.io/library/wordpress:7.1.3-php8.3-apache@sha256:607e9f6829f9e4f3001bc91c98426aaa742d164af030aa7a8073932798e2af6b
  # Consumed by the finite bootstrap; changing an established URL requires review.
  canonicalUrl: http://store.example.invalid
  authSecretName: urumi-wordpress-auth
  persistence:
    size: 2Gi
    # Empty means omit storageClassName and use the cluster default.
    storageClass: ""
    # Reuse a retained claim explicitly; no PVC is rendered when set.
    existingClaim: ""
  ingress:
    className: traefik
    host: store.example.invalid
    tls:
      enabled: false
      secretName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

mariadb:
  # The tag communicates the version; the digest fixes Linux/amd64 contents.
  image: docker.io/library/mariadb:11.4.13-noble@sha256:f2f5e00999bd335343e09091e27e39c9386eb1822efcd0e0bac40b0003fa47e3
  # WordPress DB hostname is derived from this chart's MariaDB Service name.
  database: urumi_store
  username: urumi_wp
  port: 3306
  rootSecretName: urumi-mariadb-root
  appSecretName: urumi-store-db
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Accepted demo defaults; these are non-secret business configuration.
store:
  title: Urumi Demo Store
  timezone: Asia/Kolkata
  country: IN
  currency: INR

woocommerce:
  version: "11.2.1"
  archiveUrl: https://downloads.wordpress.org/plugin/woocommerce.11.2.1.zip
  archiveSha256: 5317434cb381b5fdc7c1dd6ee258324f08c390976aaf8d1199f2a0e9a3ab8586

bootstrap:
  # Contract v3 explicitly migrates a completed v2 store to public Live visibility.
  # This is not the Helm release revision; other transitions are rejected.
  version: "3"
  image: docker.io/library/wordpress:cli-2.12.0-php8.3@sha256:07e56f9242a5c5e194bb0191c0f95a07fd1eefe712a231fc444d67eb51bb01e8
  adminSecretName: urumi-wordpress-admin
  adminUsername: urumi-admin
  adminEmail: admin@example.invalid
  waitTimeoutSeconds: 120
  retryIntervalSeconds: 3
  commandTimeoutSeconds: 120
  connectionTimeoutSeconds: 5
  activeDeadlineSeconds: 600
  backoffLimit: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Stage 8 caller authentication is required; external token matches the gateway seed.
wooMcp:
  enabled: false
  image:
    repository: urumi-woo-mcp
    tag: stage8.0
    pullPolicy: IfNotPresent
  restSecretName: urumi-woocommerce-rest
  callerAuthSecretName: urumi-woo-mcp-auth
  config:
    # Empty derives the WordPress Service DNS from release/namespace.
    connection_origin: ""
    canonical_origin: http://store.example.invalid
    secret_directory: /run/secrets/woocommerce-rest
    deadline_seconds: 8
    currency: INR
    store_timezone: Asia/Kolkata
    # Empty derives exact Service DNS and loopback forms, bare and :8000.
    allowed_hosts: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# Stage 6.1 stateless upstreams: opt in through environment values; no Secrets.
auxiliaryMcp:
  arithmetic-mcp:
    enabled: false
    image:
      repository: urumi-arithmetic-mcp
      tag: stage6.1
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  store-policy-mcp:
    enabled: false
    image:
      repository: urumi-store-policy-mcp
      tag: stage6.1
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

# Stage 8 full-stack packaging; external Secrets must exist before deployment.
platform:
  enabled: false
  origin: http://gateway.urumi.test:8080
  adminSecretName: urumi-admin-bootstrap
  postgres:
    image:
      repository: postgres
      tag: 18.6-bookworm
      digest: sha256:6b38fe68f2c02cafffbbce7496f76d110d8a947c039bd22c067e9a43c2250240
    secretName: urumi-postgres-auth
    user: urumi_gateway
    database: urumi_gateway
    storageClass: ""
    storageSize: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  gateway:
    image: {repository: urumi-gateway, tag: stage8.0, pullPolicy: Never}
    environment: local
    secureCookie: false
    sessionSeconds: 28800
    invitationSeconds: 86400
    model: gemini-3.8-flash
    providerTimeoutSeconds: 30
    maxToolRounds: 5
    geminiSecretName: urumi-gemini
    resources:
      requests: {cpu: 100m, memory: 192Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  dashboard:
    image: {repository: urumi-dashboard, tag: stage7.1, pullPolicy: Never}
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  jobResources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  ingress:
    className: traefik
    host: gateway.urumi.test
    tls: {enabled: false, secretName: ""}
