# Stage 3.3: bootstrap/readiness implemented for static review; runtime unverified.
# Namespace comes from Helm --namespace; this chart does not create it.
# Secrets are supplied externally. These values contain references, never values.

wordpress:
  # The tag communicates the version; the digest fixes Linux/amd64 contents.
  image: docker.io/library/wordpress:7.1.3-php8.3-apache@sha256:607e9f6829f9e4f3001bc91c98426aaa742d164af030aa7a8073932798e2af6b
  # Consumed by the finite bootstrap; changing an established URL requires review.
  canonicalUrl: http://store.example.invalid
  authSecretName: urumi-wordpress-auth
  persistence:
    size: 2Gi
    # Empty means omit storageClassName and use the cluster default.
    storageClass: ""
    # Reuse a retained claim explicitly; no PVC is rendered when set.
    existingClaim: ""
  ingress:
    className: traefik
    host: store.example.invalid
    tls:
      enabled: false
      secretName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

mariadb:
  # The tag communicates the version; the digest fixes Linux/amd64 contents.
  image: docker.io/library/mariadb:11.4.13-noble@sha256:f2f5e00999bd335343e09091e27e39c9386eb1822efcd0e0bac40b0003fa47e3
  # WordPress DB hostname is derived from this chart's MariaDB Service name.
  database: urumi_store
  username: urumi_wp
  port: 3306
  rootSecretName: urumi-mariadb-root
  appSecretName: urumi-store-db
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Accepted demo defaults; these are non-secret business configuration.
store:
  title: Urumi Demo Store
  timezone: Asia/Kolkata
  country: IN
  currency: INR

woocommerce:
  version: "11.2.1"
  archiveUrl: https://downloads.wordpress.org/plugin/woocommerce.11.2.1.zip
  archiveSha256: 5317434cb381b5fdc7c1dd6ee258324f08c390976aaf8d1199f2a0e9a3ab8586

bootstrap:
  # Contract v3 explicitly migrates a completed v2 store to public Live visibility.
  # This is not the Helm release revision; other transitions are rejected.
  version: "3"
  image: docker.io/library/wordpress:cli-2.12.0-php8.3@sha256:07e56f9242a5c5e194bb0191c0f95a07fd1eefe712a231fc444d67eb51bb01e8
  adminSecretName: urumi-wordpress-admin
  adminUsername: urumi-admin
  adminEmail: admin@example.invalid
  waitTimeoutSeconds: 120
  retryIntervalSeconds: 3
  commandTimeoutSeconds: 120
  connectionTimeoutSeconds: 5
  activeDeadlineSeconds: 600
  backoffLimit: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
