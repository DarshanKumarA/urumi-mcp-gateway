{{- if .Values.platform.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "urumi.platformLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "urumi.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "urumi.fullname" . }}-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "urumi.platformLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.platformLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ printf "%s:%s@%s" .Values.platform.postgres.image.repository .Values.platform.postgres.image.tag .Values.platform.postgres.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "urumi.platformContainerSecurity" . | nindent 12 }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: {{ .Values.platform.postgres.user | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.platform.postgres.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres/password}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: password, mountPath: /run/secrets/postgres, readOnly: true}
          startupProbe:
            exec: {command: [pg_isready, -h, '127.0.0.1', -U, {{ .Values.platform.postgres.user | quote }}, -d, {{ .Values.platform.postgres.database | quote }}]}
            periodSeconds: 3
            failureThreshold: 60
            timeoutSeconds: 2
          readinessProbe:
            exec: {command: [pg_isready, -h, '127.0.0.1', -U, {{ .Values.platform.postgres.user | quote }}, -d, {{ .Values.platform.postgres.database | quote }}]}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec: {command: [pg_isready, -h, '127.0.0.1', -U, {{ .Values.platform.postgres.user | quote }}, -d, {{ .Values.platform.postgres.database | quote }}]}
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.platform.postgres.resources | nindent 12 }}
      volumes:
        - {name: socket, emptyDir: {sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - name: password
          secret:
            secretName: {{ .Values.platform.postgres.secretName | quote }}
            defaultMode: 0440
            items: [{key: password, path: password}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.platform.postgres.storageClass }}
        storageClassName: {{ .Values.platform.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.platform.postgres.storageSize | quote }}}
{{- end }}
