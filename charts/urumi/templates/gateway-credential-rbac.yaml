{{- if .Values.platform.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-credential-store
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "urumi.fullname" . }}-credential-store
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-upstream-credentials" (include "urumi.fullname" .) | quote }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "urumi.fullname" . }}-credential-store
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "urumi.fullname" . }}-credential-store
subjects:
  - kind: ServiceAccount
    name: {{ include "urumi.fullname" . }}-credential-store
    namespace: {{ .Release.Namespace }}
{{- end }}
