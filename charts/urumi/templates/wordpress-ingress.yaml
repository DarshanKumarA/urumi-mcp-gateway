apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urumi.wordpressName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  ingressClassName: {{ .Values.wordpress.ingress.className | quote }}
  {{- if .Values.wordpress.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.wordpress.ingress.host | quote }}
      secretName: {{ required "Set wordpress.ingress.tls.secretName when TLS is enabled" .Values.wordpress.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.wordpress.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.wordpressName" . }}
                port:
                  number: 80
