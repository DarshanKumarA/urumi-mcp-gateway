{{- if .Values.wooMcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.wooMcpName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  type: ClusterIP
  selector:
    {{- include "urumi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
