apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.mariadbName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "urumi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
  ports:
    - name: mysql
      port: {{ .Values.mariadb.port }}
      targetPort: mysql
